<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --surface: #0f0f0f;
            --border: #1c1c1c;
            --border-hover: #2a2a2a;
            --text: #d4d4d4;
            --text-muted: #525252;
            --text-dim: #333333;
            --accent: #3b82f6;
            --accent-dim: #1d3b6e;
            --user-accent: #404040;
            --code-bg: #0a0a0a;
            --input-bg: #111111;
            --council-accent: #7c3aed;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 300;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
            letter-spacing: 0.01em;
        }

        /* Header */
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 52px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg);
        }

        #header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #wordmark {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: var(--text);
        }

        #project-selector {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #project-select {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-family: 'IBM Plex Mono', monospace;
            cursor: pointer;
            outline: none;
            letter-spacing: 0.05em;
            transition: border-color 0.15s, color 0.15s;
        }

            #project-select:hover {
                border-color: var(--border-hover);
                color: var(--text);
            }

        #load-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 4px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 0.08em;
            transition: all 0.15s;
        }

            #load-btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            #load-btn:disabled {
                opacity: 0.3;
                cursor: not-allowed;
            }

        #project-status {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--text-dim);
        }

            #project-status.active {
                color: var(--accent);
            }

            #project-status.loading {
                color: var(--warning);
            }

        #header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #memory-indicator {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #memory-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--success);
            opacity: 0.6;
        }

        #reset-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 11px;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 0.08em;
            padding: 4px 8px;
            border-radius: 3px;
            transition: color 0.15s;
        }

            #reset-btn:hover {
                color: var(--text-muted);
            }

        /* Messages */
        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 32px 0;
            display: flex;
            flex-direction: column;
            gap: 0;
        }

            #messages::-webkit-scrollbar {
                width: 3px;
            }

            #messages::-webkit-scrollbar-track {
                background: transparent;
            }

            #messages::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 2px;
            }

        .message-row {
            display: flex;
            padding: 0 24px;
            margin-bottom: 2px;
            flex-shrink: 0;
        }

            .message-row.user {
                justify-content: flex-end;
            }

            .message-row.assistant {
                justify-content: flex-start;
            }

            .message-row.system-row {
                justify-content: center;
            }

        .bubble {
            max-width: 720px;
            line-height: 1.65;
            white-space: pre-wrap;
            word-break: break-word;
        }

            .bubble.user {
                color: var(--text-muted);
                font-size: 13px;
                padding: 10px 14px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px 8px 2px 8px;
            }

            .bubble.assistant {
                color: var(--text);
                font-size: 14px;
                padding: 12px 16px 12px 14px;
                border-left: 2px solid var(--accent);
                margin-left: 2px;
            }

                .bubble.assistant.council-response {
                    border-left-color: var(--council-accent);
                }

        .role-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.15em;
            margin-bottom: 6px;
            display: block;
        }

            .role-label.kamil {
                color: var(--accent);
            }

            .role-label.council {
                color: var(--council-accent);
            }

        .system-msg {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.1em;
            padding: 6px 0;
        }

        /* Code blocks */
        .bubble pre {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 12px 14px;
            overflow-x: auto;
            margin: 10px 0;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .bubble code {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 12px;
            background: var(--code-bg);
            padding: 1px 5px;
            border-radius: 2px;
            color: #93c5fd;
        }

        .bubble pre code {
            background: transparent;
            padding: 0;
            color: var(--text);
        }

        /* Cursor */
        .cursor {
            display: inline-block;
            width: 1.5px;
            height: 14px;
            background: var(--accent);
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% {
                opacity: 1;
            }

            50%, 100% {
                opacity: 0;
            }
        }

        /* Council block */
        .council-block {
            max-width: 720px;
            margin: 0 24px;
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .council-section-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.15em;
            padding: 7px 14px;
            border-bottom: 1px solid var(--border);
        }

            .council-section-label.analyst {
                color: #22c55e;
                background: #0a1a0a;
            }

            .council-section-label.advocate {
                color: #f97316;
                background: #1a0d00;
            }

            .council-section-label.synthesizer {
                color: var(--council-accent);
                background: #0e0a1a;
            }

        .council-section-body {
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.65;
            max-height: 220px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

            .council-section-body.analyst {
                color: #a3d9a5;
                background: #080d08;
            }

            .council-section-body.advocate {
                color: #d4a0a0;
                background: #0d0800;
            }

            .council-section-body.synthesizer {
                color: var(--text);
                background: #0a080f;
            }

            .council-section-body::-webkit-scrollbar {
                width: 3px;
            }

            .council-section-body::-webkit-scrollbar-thumb {
                background: var(--border);
            }

        /* Confirmation panel */
        #confirm-panel {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            width: 680px;
            max-width: calc(100vw - 48px);
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 6px;
            padding: 16px 18px;
            z-index: 100;
            display: none;
        }

            #confirm-panel.visible {
                display: block;
            }

        .confirm-label {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            letter-spacing: 0.15em;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .confirm-detail {
            background: var(--code-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 10px 12px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: var(--text);
            white-space: pre-wrap;
            max-height: 120px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .confirm-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .confirm-approve, .confirm-reject {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: 0.1em;
            padding: 6px 14px;
            border-radius: 3px;
            cursor: pointer;
            border: 1px solid;
            background: transparent;
            transition: all 0.15s;
        }

        .confirm-approve {
            border-color: var(--success);
            color: var(--success);
        }

            .confirm-approve:hover {
                background: rgba(34, 197, 94, 0.1);
            }

        .confirm-reject {
            border-color: #ef4444;
            color: #ef4444;
        }

            .confirm-reject:hover {
                background: rgba(239, 68, 68, 0.1);
            }

        /* Enroll modal */
        #enroll-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }

            #enroll-modal.visible {
                display: flex;
            }

        #enroll-modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 24px;
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #enroll-modal-title {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.15em;
            color: var(--accent);
        }

        #enroll-name, #enroll-trust {
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            padding: 8px 10px;
            font-size: 12px;
            font-family: 'IBM Plex Mono', monospace;
            outline: none;
            width: 100%;
        }

            #enroll-name:focus, #enroll-trust:focus {
                border-color: var(--border-hover);
            }

        #enroll-modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

            #enroll-modal-actions button {
                font-family: 'IBM Plex Mono', monospace;
                font-size: 10px;
                letter-spacing: 0.1em;
                padding: 6px 14px;
                border-radius: 3px;
                cursor: pointer;
                background: transparent;
                border: 1px solid var(--border);
                color: var(--text-muted);
                transition: all 0.15s;
            }

        #enroll-start-btn {
            border-color: var(--accent) !important;
            color: var(--accent) !important;
        }

        /* Input area */
        #input-area {
            border-top: 1px solid var(--border);
            padding: 12px 24px 16px;
            flex-shrink: 0;
            background: var(--bg);
        }

        #input-wrap {
            max-width: 720px;
            margin: 0 auto;
        }

        #input-toolbar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
            opacity: 1;
            transition: opacity 0.2s;
        }

        #input-wrap:not(:focus-within) #input-toolbar {
            opacity: 0.3;
        }

        #input-wrap:hover #input-toolbar,
        #input-wrap:focus-within #input-toolbar {
            opacity: 1;
        }

        .toolbar-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 10px;
            font-family: 'IBM Plex Mono', monospace;
            letter-spacing: 0.1em;
            transition: all 0.15s;
            white-space: nowrap;
        }

            .toolbar-btn:hover {
                border-color: var(--border-hover);
                color: var(--text);
            }

            .toolbar-btn.active {
                border-color: #ef4444;
                color: #ef4444;
                animation: pulse 1s infinite;
            }

            .toolbar-btn.enroll {
                margin-left: auto;
            }

                .toolbar-btn.enroll:hover {
                    border-color: var(--accent);
                    color: var(--accent);
                }

        #input-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }

        #input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            padding: 12px 14px;
            font-size: 13px;
            font-family: 'IBM Plex Sans', sans-serif;
            font-weight: 300;
            resize: none;
            min-height: 46px;
            max-height: 180px;
            outline: none;
            transition: border-color 0.15s;
            line-height: 1.6;
            letter-spacing: 0.01em;
        }

            #input:focus {
                border-color: var(--border-hover);
            }

            #input::placeholder {
                color: var(--text-dim);
            }

        #send-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim);
            cursor: pointer;
            padding: 8px 12px;
            border-radius: 6px;
            transition: all 0.15s;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 13px;
            height: 46px;
            flex-shrink: 0;
        }

            #send-btn:hover {
                border-color: var(--accent);
                color: var(--accent);
            }

            #send-btn:disabled {
                opacity: 0.2;
                cursor: not-allowed;
            }

        #input-hint {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: var(--text-dim);
            letter-spacing: 0.08em;
            margin-top: 8px;
            text-align: center;
        }

            #input-hint span {
                color: var(--text-muted);
            }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .council-section-body::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>
<body>

    <div id="header">
        <div id="header-left">
            <div id="wordmark">KAMIL</div>
            <div id="project-selector">
                <select id="project-select"><option value="">no project</option></select>
                <button id="load-btn" onclick="loadProject()">load</button>
                <span id="project-status">—</span>
            </div>
        </div>
        <div id="header-right">
            <div id="memory-indicator">
                <div id="memory-dot"></div>
                <span id="memory-label">memory active</span>
            </div>
            <button id="reset-btn" onclick="resetChat()">clear</button>
        </div>
    </div>

    <div id="messages">
        <div class="message-row system-row">
            <span class="system-msg">kamil · local · offline · type /council for deliberation</span>
        </div>
    </div>

    <div id="confirm-panel">
        <div class="confirm-label">ACTION REQUIRES APPROVAL</div>
        <div class="confirm-detail" id="confirm-detail"></div>
        <div class="confirm-actions">
            <button class="confirm-reject" onclick="confirmReject()">reject</button>
            <button class="confirm-approve" onclick="confirmApprove()">approve</button>
        </div>
    </div>

    <!-- Enroll modal -->
    <div id="enroll-modal">
        <div id="enroll-modal-box">
            <div id="enroll-modal-title">ENROLL VOICE</div>
            <input id="enroll-name" type="text" placeholder="name" />
            <select id="enroll-trust">
                <option value="owner">owner</option>
                <option value="trusted" selected>trusted</option>
                <option value="guest">guest</option>
            </select>
            <div id="enroll-modal-actions">
                <button onclick="closeEnrollModal()">cancel</button>
                <button id="enroll-start-btn" onclick="startEnrollment()">start recording</button>
            </div>
        </div>
    </div>

    <div id="input-area">
        <div id="input-wrap">
            <div id="input-toolbar">
                <button id="mic-btn" class="toolbar-btn" onclick="toggleMic()">mic</button>
                <button id="enroll-btn" class="toolbar-btn enroll" onclick="enrollVoice()">enroll voice</button>
            </div>
            <div id="input-row">
                <textarea id="input" placeholder="ask kamil anything..." rows="1"></textarea>
                <button id="send-btn" onclick="sendMessage()">↑</button>
            </div>
        </div>
        <div id="input-hint">enter to send · shift+enter for newline · <span>/council</span> deliberation · <span>/agent</span> tool use</div>
    </div>

    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const projectSelect = document.getElementById('project-select');
        const projectStatus = document.getElementById('project-status');
        const loadBtn = document.getElementById('load-btn');

        let agentApprovalResolve = null;   // set while an agent run awaits approval

        // Voice variables
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let currentAudio = null;

        let disabledTimeout = null;        // track the hang‑timeout

        function setDisabled(val) {
            sendBtn.disabled = val;
            inputEl.disabled = val;

            // clear any previous timeout
            if (disabledTimeout) clearTimeout(disabledTimeout);

            if (val) {
                // Auto‑reset after 30 seconds in case of a hang
                disabledTimeout = setTimeout(() => {
                    if (sendBtn.disabled) {
                        console.log('Auto‑resetting disabled state after timeout');
                        setDisabled(false);
                    }
                }, 120000);
            }
        }

        async function toggleMic() {
            // Interrupt any currently playing audio
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.src = '';
                currentAudio = null;
            }
            if (isRecording) {
                mediaRecorder.stop();
                return;
            }
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    document.getElementById('mic-btn').classList.remove('active');
                    isRecording = false;

                    // Guard: prevent double processing if onstop fires twice
                    if (audioChunks.length === 0) return;

                    const blob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];   // clear immediately to prevent double processing

                    appendSystem('transcribing...');
                    try {
                        const res = await fetch('/transcribe', {
                            method: 'POST',
                            headers: { 'Content-Type': 'audio/webm' },
                            body: blob
                        });
                        const data = await res.json();
                        console.log('transcribe result:', data);
                        // Remove "transcribing" message
                        const msgs = document.querySelectorAll('.system-msg');
                        msgs[msgs.length - 1].parentElement.remove();
                        if (data.text) {
                            await sendVoiceMessage(data.text);
                        } else {
                            appendSystem('could not transcribe audio');
                        }
                    } catch (e) {
                        appendSystem('transcription error: ' + e.message);
                    }
                };
                mediaRecorder.start();
                isRecording = true;
                document.getElementById('mic-btn').classList.add('active');
                appendSystem('recording... tap mic to stop');
            } catch (e) {
                appendSystem('mic error: ' + e.message);
            }
        }

        function enrollVoice() {
            document.getElementById('enroll-modal').classList.add('visible');
            document.getElementById('enroll-name').focus();
        }

        function closeEnrollModal() {
            document.getElementById('enroll-modal').classList.remove('visible');
        }

        async function startEnrollment() {
            const name = document.getElementById('enroll-name').value.trim();
            const trust = document.getElementById('enroll-trust').value;
            if (!name) {
                document.getElementById('enroll-name').focus();
                return;
            }
            closeEnrollModal();

            const enrollBtn = document.getElementById('enroll-btn');
            enrollBtn.textContent = 'recording...';
            enrollBtn.disabled = true;

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const recorder = new MediaRecorder(stream);
                const chunks = [];

                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    appendSystem(`enrolling ${name}...`);
                    try {
                        const res = await fetch('/speakers/enroll', {
                            method: 'POST',
                            headers: {
                                'X-Speaker-Name': name,
                                'X-Trust-Level': trust
                            },
                            body: blob
                        });
                        const data = await res.json();
                        if (data.success) {
                            appendSystem(`voice enrolled: ${data.name} (${data.trust_level}, ${data.samples_used} samples)`);
                        } else {
                            appendSystem(`enrollment failed: ${data.error}`);
                        }
                    } catch (e) {
                        appendSystem(`enrollment error: ${e.message}`);
                    }
                    enrollBtn.textContent = 'enroll voice';
                    enrollBtn.disabled = false;
                };

                recorder.start();
                appendSystem(`recording 15s — speak naturally...`);
                setTimeout(() => recorder.stop(), 15000);
            } catch (e) {
                appendSystem(`mic error: ${e.message}`);
                enrollBtn.textContent = 'enroll voice';
                enrollBtn.disabled = false;
            }
        }

        async function sendVoiceMessage(text) {
            if (!text || sendBtn.disabled) return;
            inputEl.value = '';
            setDisabled(true);
            appendUser(text);

            const contentEl = appendAssistant('', false);
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            contentEl.parentElement.appendChild(cursor);

            try {
                const res = await fetch('/voice_chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text })
                });
                const data = await res.json();

                if (data.error) {
                    contentEl.textContent = 'Error: ' + data.error;
                    return;
                }

                // Play handoff phrase immediately if present
                if (data.handoff_audio) {
                    await playAudio(data.handoff_audio);
                }

                // Show and play final response
                contentEl.textContent = data.text;
                if (data.audio) {
                    await playAudio(data.audio);
                }
            } catch (e) {
                contentEl.textContent = 'Error: ' + e.message;
            } finally {
                // safety: only remove cursor if it's still in the DOM
                if (cursor && cursor.parentElement) cursor.remove();
                setDisabled(false);
                inputEl.focus();
                scrollBottom();
            }
        }

        function playAudio(b64) {
            return new Promise((resolve) => {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.src = '';
                    currentAudio = null;
                }
                if (!b64) return resolve();
                const audioData = atob(b64);
                const audioArray = new Uint8Array(audioData.length);
                for (let i = 0; i < audioData.length; i++) {
                    audioArray[i] = audioData.charCodeAt(i);
                }
                const blob = new Blob([audioArray], { type: 'audio/wav' });
                const url = URL.createObjectURL(blob);
                currentAudio = new Audio(url);
                currentAudio.play().catch(e => console.error('audio:', e));
                currentAudio.onended = () => {
                    URL.revokeObjectURL(url);
                    currentAudio = null;
                    resolve();
                };
            });
        }

        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 180) + 'px';
        });

        inputEl.addEventListener('keydown', e => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendSystem(text) {
            const row = document.createElement('div');
            row.className = 'message-row system-row';
            row.innerHTML = `<span class="system-msg">${text}</span>`;
            messagesEl.appendChild(row);
            scrollBottom();
        }

        function appendUser(text) {
            const row = document.createElement('div');
            row.className = 'message-row user';
            row.innerHTML = `<div class="bubble user">${escapeHtml(text)}</div>`;
            messagesEl.appendChild(row);
            scrollBottom();
        }

        function appendAssistant(text, isCouncil) {
            const row = document.createElement('div');
            row.className = 'message-row assistant';
            const bubble = document.createElement('div');
            bubble.className = 'bubble assistant' + (isCouncil ? ' council-response' : '');

            const label = document.createElement('span');
            label.className = 'role-label ' + (isCouncil ? 'council' : 'kamil');
            label.textContent = isCouncil ? 'COUNCIL' : 'KAMIL';
            bubble.appendChild(label);

            const content = document.createElement('span');
            content.textContent = text || '';
            bubble.appendChild(content);

            row.appendChild(bubble);
            messagesEl.appendChild(row);
            scrollBottom();
            return content;
        }

        // Kamil reaching out unprompted (from the presence heartbeat).
        function appendProactive(text) {
            appendSystem('kamil reached out');
            appendAssistant(text, false);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function scrollBottom() {
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || sendBtn.disabled) return;
            inputEl.value = '';
            inputEl.style.height = 'auto';
            setDisabled(true);

            appendUser(text);

            const isCouncil = text.startsWith('/council');
            const cleanText = isCouncil ? text.slice(8).trim() : text;

            if (isCouncil) {
                await sendCouncil(cleanText);
                setDisabled(false);
                inputEl.focus();
                return;
            }

            const isAgent = text.startsWith('/agent');
            if (isAgent) {
                await sendAgent(text.slice(6).trim());
                setDisabled(false);
                inputEl.focus();
                return;
            }

            const contentEl = appendAssistant('', false);
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            contentEl.parentElement.appendChild(cursor);

            let fullText = '';

            try {
                const res = await fetch('/chat_agentic', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text })
                });

                const reader = res.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;
                        try {
                            const parsed = JSON.parse(data);
                            if (parsed.chunk) {
                                fullText += parsed.chunk;
                                contentEl.textContent = fullText;
                                contentEl.parentElement.appendChild(cursor);
                                scrollBottom();
                            }
                            if (parsed.error) {
                                contentEl.textContent = 'Error: ' + parsed.error;
                            }
                        } catch { }
                    }
                }
            } catch (e) {
                contentEl.textContent = 'Connection error: ' + e.message;
            } finally {
                if (cursor && cursor.parentElement) cursor.remove();
                setDisabled(false);
                inputEl.focus();
            }
        }

        async function sendCouncil(text) {
            appendSystem('council deliberating...');
            try {
                const res = await fetch('/council', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text })
                });
                const data = await res.json();

                const msgs = messagesEl.querySelectorAll('.system-msg');
                msgs[msgs.length - 1].parentElement.remove();

                if (data.error) { appendSystem('council error: ' + data.error); return; }

                const block = document.createElement('div');
                block.className = 'council-block';
                block.innerHTML = `
                              <div class="council-section-label analyst">ANALYST — QWEN</div>
                              <div class="council-section-body analyst">${escapeHtml(data.analyst || '')}</div>
                              <div class="council-section-label advocate">DEVIL'S ADVOCATE — DOLPHIN</div>
                              <div class="council-section-body advocate">${escapeHtml(data.advocate || '')}</div>
                              <div class="council-section-label synthesizer">SYNTHESIZER — LLAMA 3.1</div>
                              <div class="council-section-body synthesizer">${escapeHtml(data.synthesizer || '')}</div>
                            `;
                messagesEl.appendChild(block);
                setTimeout(() => messagesEl.scrollTop = messagesEl.scrollHeight, 50);
            } catch (e) {
                appendSystem('council error: ' + e.message);
            }
        }

        // ── Agent mode: multi-step tool-use loop with confirmation resume ──

        async function sendAgent(text) {
            if (!text) { appendSystem('usage: /agent <task>'); return; }
            appendSystem('agent working...');
            const ctx = { bubble: null };
            try {
                await runAgentStream(fetch('/chat_agent', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text })
                }), ctx);
            } catch (e) {
                appendSystem('agent error: ' + e.message);
            }
        }

        // Process a stream; if it pauses for approval, collect decisions and resume.
        async function runAgentStream(fetchPromise, ctx) {
            const res = await fetchPromise;
            const pause = await processAgentStream(res, ctx);
            if (pause) {
                const approvals = await collectApprovals(pause.pending);
                await runAgentStream(fetch('/agent_resume', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ run_id: pause.run_id, approvals })
                }), ctx);
            }
        }

        async function processAgentStream(res, ctx) {
            const reader = res.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let pause = null;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const lines = buffer.split('\n');
                buffer = lines.pop();
                for (const line of lines) {
                    if (!line.startsWith('data: ')) continue;
                    const data = line.slice(6);
                    if (data === '[DONE]') continue;
                    let ev;
                    try { ev = JSON.parse(data); } catch { continue; }
                    handleAgentEvent(ev, ctx);
                    if (ev.type === 'awaiting_confirmation') {
                        pause = { run_id: ev.run_id, pending: ev.pending };
                    }
                }
            }
            return pause;
        }

        function shortParams(params) {
            const s = JSON.stringify(params || {});
            return s.length > 90 ? s.slice(0, 90) + '…' : s;
        }

        function handleAgentEvent(ev, ctx) {
            switch (ev.type) {
                case 'text':
                    if (ev.text) ctx.bubble = appendAssistant(ev.text, false);
                    break;
                case 'tool_call':
                    appendSystem(`→ ${ev.tool} ${shortParams(ev.params)}`);
                    ctx.bubble = null;
                    break;
                case 'tool_result':
                    appendSystem(`${ev.success ? '✓' : '✗'} ${ev.tool}` +
                        (ev.success ? '' : ' — ' + ((ev.result && ev.result.error) || 'failed')));
                    break;
                case 'done':
                    if (ev.text) {
                        if (ctx.bubble) ctx.bubble.textContent = ev.text;
                        else ctx.bubble = appendAssistant(ev.text, false);
                    }
                    break;
                case 'max_iterations':
                    appendSystem('agent stopped — reached step limit');
                    break;
                case 'awaiting_confirmation':
                    appendSystem(`${ev.pending.length} action(s) need your approval`);
                    break;
                case 'error':
                    appendSystem('agent error: ' + (ev.error || 'unknown'));
                    break;
            }
        }

        // Show each pending tool in the confirm panel, await approve/reject.
        async function collectApprovals(pending) {
            const approvals = [];
            for (const call of pending) {
                document.getElementById('confirm-detail').textContent = JSON.stringify(call, null, 2);
                document.getElementById('confirm-panel').classList.add('visible');
                const ok = await new Promise(resolve => { agentApprovalResolve = resolve; });
                approvals.push(ok);
                appendSystem(`${ok ? 'approved' : 'denied'}: ${call.tool}`);
            }
            document.getElementById('confirm-panel').classList.remove('visible');
            return approvals;
        }

        // Confirm-panel buttons resolve the pending agent approval (see collectApprovals).
        function confirmApprove() {
            if (agentApprovalResolve) { const r = agentApprovalResolve; agentApprovalResolve = null; r(true); }
        }
        function confirmReject() {
            if (agentApprovalResolve) { const r = agentApprovalResolve; agentApprovalResolve = null; r(false); }
        }

        async function loadProjects() {
            const res = await fetch('/projects');
            const data = await res.json();
            data.projects.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                projectSelect.appendChild(opt);
            });
        }

        async function loadProject() {
            const name = projectSelect.value;
            if (!name) return;
            loadBtn.disabled = true;
            projectStatus.textContent = 'indexing...';
            projectStatus.className = 'loading';
            try {
                const res = await fetch('/select_project', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_name: name })
                });
                const data = await res.json();
                projectStatus.textContent = data.chunks === 'cached' ? `${name} · cached` : `${name} · ${data.chunks} chunks`;
                projectStatus.className = 'active';
            } catch {
                projectStatus.textContent = 'error';
                projectStatus.className = '';
            }
            loadBtn.disabled = false;
        }

        async function resetChat() {
            await fetch('/reset', { method: 'POST' });
            messagesEl.innerHTML = '';
            appendSystem('kamil · local · offline · type /council for deliberation');
        }

        async function restoreSession() {
            const res = await fetch('/history');
            const data = await res.json();
            if (data.history && data.history.length > 0) {
                data.history.forEach(msg => {
                    if (msg.role === 'user') appendUser(msg.content);
                    else if (msg.role === 'assistant') appendAssistant(msg.content, false);
                });
                appendSystem(`session restored · ${data.history.length} messages`);
            }
            if (data.project) {
                projectStatus.textContent = `${data.project} · restored`;
                projectStatus.className = 'active';
                const opts = projectSelect.options;
                for (let i = 0; i < opts.length; i++) {
                    if (opts[i].value === data.project) {
                        projectSelect.selectedIndex = i;
                        break;
                    }
                }
            }
        }

        // Poll for proactive messages from Kamil's heartbeat.
        async function pollPresence() {
            try {
                const res = await fetch('/presence');
                if (!res.ok) return;
                const data = await res.json();
                (data.messages || []).forEach(m => appendProactive(m.text));
            } catch { }
        }

        loadProjects().then(restoreSession);
        setInterval(pollPresence, 30000);
    </script>
</body>
</html>
