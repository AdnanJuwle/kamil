<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        #header {
            padding: 12px 24px;
            border-bottom: 1px solid #1e1e1e;
            display: flex;
            align-items: center;
            gap: 16px;
        }

            #header h1 {
                font-size: 16px;
                font-weight: 600;
                letter-spacing: 2px;
                color: #ffffff;
                min-width: fit-content;
            }

        #project-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
        }

        #project-select {
            background: #111;
            border: 1px solid #222;
            color: #e0e0e0;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            outline: none;
        }

        #load-project-btn {
            background: none;
            border: 1px solid #2a2a4a;
            color: #4a9eff;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.15s;
        }

            #load-project-btn:hover {
                background: #1a1a2e;
            }

            #load-project-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

        #project-status {
            font-size: 11px;
            color: #444;
            letter-spacing: 1px;
        }

            #project-status.active {
                color: #4a9eff;
            }

            #project-status.loading {
                color: #f0a500;
            }

        #reset-btn {
            background: none;
            border: 1px solid #2a2a2a;
            color: #666;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            transition: all 0.15s;
            margin-left: auto;
        }

            #reset-btn:hover {
                border-color: #444;
                color: #aaa;
            }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
            flex-shrink: 0;
        }

            .message.user {
                color: #a0a0a0;
            }

                .message.user::before {
                    content: "YOU";
                    display: block;
                    font-size: 10px;
                    letter-spacing: 2px;
                    color: #444;
                    margin-bottom: 6px;
                }

            .message.assistant {
                color: #e0e0e0;
            }

                .message.assistant::before {
                    content: "KAMIL";
                    display: block;
                    font-size: 10px;
                    letter-spacing: 2px;
                    color: #4a9eff;
                    margin-bottom: 6px;
                }

        .system-msg {
            max-width: 820px;
            margin: 0 auto;
            font-size: 11px;
            color: #333;
            letter-spacing: 1px;
            text-align: center;
        }

        #input-area {
            padding: 20px 24px;
            border-top: 1px solid #1e1e1e;
        }

        #input-wrap {
            max-width: 820px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }

        #input {
            flex: 1;
            background: #111;
            border: 1px solid #222;
            border-radius: 6px;
            color: #e0e0e0;
            padding: 12px 16px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 48px;
            max-height: 200px;
            outline: none;
            transition: border-color 0.15s;
            line-height: 1.5;
        }

            #input:focus {
                border-color: #333;
            }

        #send-btn {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            color: #4a9eff;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.15s;
            height: 48px;
        }

            #send-btn:hover {
                background: #1e1e3a;
                border-color: #4a9eff;
            }

            #send-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

        #action-btn {
            background: #0d1a0d;
            border: 1px solid #2a4a2a;
            color: #4aff4a;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.15s;
            height: 48px;
        }

            #action-btn:hover {
                background: #1a2e1a;
                border-color: #4aff4a;
            }

            #action-btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }

        #confirmation-panel {
            position: fixed;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 820px;
            max-width: calc(100vw - 48px);
            background: #111;
            border: 1px solid #4a9eff;
            border-radius: 8px;
            padding: 16px;
            z-index: 100;
            display: none;
        }

            #confirmation-panel.visible {
                display: block;
            }

        .confirm-title {
            font-size: 11px;
            letter-spacing: 2px;
            color: #4a9eff;
            margin-bottom: 10px;
        }

        .confirm-action-detail {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 4px;
            padding: 10px 12px;
            font-size: 12px;
            font-family: 'Cascadia Code', monospace;
            color: #e0e0e0;
            white-space: pre-wrap;
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 12px;
        }

        .confirm-buttons {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .confirm-approve {
            background: #0d1a0d;
            border: 1px solid #4aff4a;
            color: #4aff4a;
            padding: 7px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .confirm-reject {
            background: #1a0d0d;
            border: 1px solid #ff4a4a;
            color: #ff4a4a;
            padding: 7px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
        }

            #council-btn {
                background: #1a0a2e;
                border: 1px solid #4a2a8a;
                color: #9a6aff;
                padding: 12px 16px;
                border-radius: 6px;
                cursor: pointer;
                font-size: 13px;
                letter-spacing: 1px;
                transition: all 0.15s;
                height: 48px;
            }

                #council-btn:hover {
                    background: #2a1a4e;
                    border-color: #9a6aff;
                }

                #council-btn:disabled {
                    opacity: 0.4;
                    cursor: not-allowed;
                }

            .council-block {
                max-width: 820px;
                width: 100%;
                margin: 0 auto;
                border: 1px solid #2a2a2a;
                border-radius: 6px;
                overflow: visible;
                flex-shrink: 0;
            }

            .council-role {
                padding: 12px 16px;
                font-size: 13px;
                line-height: 1.6;
                white-space: pre-wrap;
                word-break: break-word;
                max-height: 250px;
                overflow-y: scroll;
                flex-shrink: 0;
            }

            .council-role::-webkit-scrollbar { width: 3px; }
            .council-role::-webkit-scrollbar-track { background: transparent; }
            .council-role::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

            .council-role-label {
                font-size: 10px;
                letter-spacing: 2px;
                padding: 8px 16px;
                border-bottom: 1px solid #1a1a1a;
            }

            .analyst-label {
                background: #0d1a0d;
                color: #4aff4a;
            }

            .analyst-body {
                background: #0a120a;
                color: #c0d0c0;
            }

            .advocate-label {
                background: #1a0d0d;
                color: #ff6a4a;
            }

            .advocate-body {
                background: #120a0a;
                color: #d0c0c0;
            }

            .synthesizer-label {
                background: #0d0d1a;
                color: #9a6aff;
            }

            .synthesizer-body {
                background: #0a0a12;
                color: #e0e0e0;
            }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 14px;
            background: #4a9eff;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        #messages::-webkit-scrollbar {
            width: 4px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #222;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>KAMIL</h1>
        <div id="project-selector">
            <select id="project-select"><option value="">— select project —</option></select>
            <button id="load-project-btn" onclick="loadProject()">LOAD</button>
            <span id="project-status">NO PROJECT</span>
        </div>
        <button id="reset-btn" onclick="resetChat()">RESET</button>
    </div>
    <div id="messages">
        <div class="system-msg">KAMIL · LOCAL · OFFLINE · SELECT A PROJECT TO ENABLE CONTEXT</div>
    </div>
    <div id="input-area">
        <div id="input-wrap">
            <textarea id="input" placeholder="Ask Kamil..." rows="1"></textarea>
            <button id="action-btn" onclick="sendWithActions()">ACTION</button>
            <button id="council-btn" onclick="sendCouncil()">COUNCIL</button>
            <button id="send-btn" onclick="sendMessage()">SEND</button>
        </div>
    </div>
    <div id="confirmation-panel">
        <div class="confirm-title">ACTION REQUIRES APPROVAL</div>
        <div class="confirm-action-detail" id="confirm-detail"></div>
        <div class="confirm-buttons">
            <button class="confirm-reject" onclick="rejectAction()">REJECT</button>
            <button class="confirm-approve" onclick="approveAction()">APPROVE</button>
        </div>
    </div>
    <script>
        const messagesEl = document.getElementById('messages');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const projectSelect = document.getElementById('project-select');
        const projectStatus = document.getElementById('project-status');
        const loadBtn = document.getElementById('load-project-btn');

        async function loadProjects() {
            const res = await fetch('/projects');
            const data = await res.json();
            data.projects.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p;
                opt.textContent = p;
                projectSelect.appendChild(opt);
            });
        }

        async function loadProject() {
            const name = projectSelect.value;
            if (!name) return;
            loadBtn.disabled = true;
            projectStatus.textContent = 'INDEXING...';
            projectStatus.className = 'loading';
            appendSystem(`Indexing ${name}...`);
            try {
                const res = await fetch('/select_project', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_name: name })
                });
                const data = await res.json();
                projectStatus.textContent = `${name} · ${data.chunks} chunks`;
                projectStatus.className = 'active';
                appendSystem(`${name} indexed — ${data.chunks} chunks. Context enabled.`);
            } catch (e) {
                projectStatus.textContent = 'ERROR';
                projectStatus.className = '';
            }
            loadBtn.disabled = false;
        }

        inputEl.addEventListener('input', () => {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 200) + 'px';
        });

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendSystem(text) {
            const div = document.createElement('div');
            div.className = 'system-msg';
            div.textContent = text;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function appendMessage(role, content = '') {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = content;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = inputEl.value.trim();
            if (!text || sendBtn.disabled) return;
            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;
            appendMessage('user', text);
            const assistantDiv = appendMessage('assistant', '');
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            assistantDiv.appendChild(cursor);
            let fullText = '';
            try {
                const response = await fetch('/chat_actions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text })
                });
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = line.slice(6);
                        if (data === '[DONE]') continue;
                        try {
                            const parsed = JSON.parse(data);
                            if (parsed.error) { assistantDiv.textContent = `Error: ${parsed.error}`; return; }
                            if (parsed.chunk) {
                                fullText += parsed.chunk;
                                assistantDiv.textContent = fullText;
                                assistantDiv.appendChild(cursor);
                                messagesEl.scrollTop = messagesEl.scrollHeight;
                            }
                            if (parsed.pending_confirmation) {
                                pendingActions = parsed.pending_confirmation;
                                currentActionIndex = 0;
                                showNextConfirmation();
                            }
                        } catch { }
                    }
                }
            } catch (err) {
                assistantDiv.textContent = `Connection error: ${err.message}`;
            } finally {
                cursor.remove();
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        async function resetChat() {
            await fetch('/reset', { method: 'POST' });
            messagesEl.innerHTML = '';
            appendSystem('KAMIL · LOCAL · OFFLINE · SELECT A PROJECT TO ENABLE CONTEXT');
        }

        async function sendCouncil() {
            const text = inputEl.value.trim();
            if (!text || sendBtn.disabled) return;
            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;
            document.getElementById('council-btn').disabled = true;

            appendMessage('user', text);
            const statusDiv = document.createElement('div');
            statusDiv.className = 'system-msg';
            statusDiv.textContent = 'Council deliberating...';
            messagesEl.appendChild(statusDiv);
            messagesEl.scrollTop = messagesEl.scrollHeight;

            try {
                const res = await fetch('/council', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text })
                });
                const data = await res.json();
                statusDiv.remove();

                if (data.error) {
                    appendSystem(`Council error: ${data.error}`);
                    return;
                }

                const block = document.createElement('div');
                block.className = 'council-block';
                block.innerHTML = `
                    <div class="council-role-label analyst-label">ANALYST — QWEN</div>
                    <div class="council-role analyst-body">${data.analyst}</div>
                    <div class="council-role-label advocate-label">DEVIL'S ADVOCATE — MISTRAL</div>
                    <div class="council-role advocate-body">${data.advocate}</div>
                    <div class="council-role-label synthesizer-label">SYNTHESIZER — LLAMA 3.1</div>
                    <div class="council-role synthesizer-body">${data.synthesizer}</div>
                `;
                messagesEl.appendChild(block);
                setTimeout(() => {
                    messagesEl.scrollTop = messagesEl.scrollHeight;
                }, 50);
            } catch(e) {
                appendSystem(`Council error: ${e.message}`);
            } finally {
                sendBtn.disabled = false;
                document.getElementById('council-btn').disabled = false;
                inputEl.focus();
            }
        }

        let pendingActions = [];
        let currentActionIndex = 0;

        function showNextConfirmation() {
            if (currentActionIndex >= pendingActions.length) {
                document.getElementById('confirmation-panel').classList.remove('visible');
                pendingActions = [];
                currentActionIndex = 0;
                return;
            }
            const action = pendingActions[currentActionIndex];
            document.getElementById('confirm-detail').textContent = JSON.stringify(action, null, 2);
            document.getElementById('confirmation-panel').classList.add('visible');
        }

        async function approveAction() {
            const action = pendingActions[currentActionIndex];
            const res = await fetch('/execute_action', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action })
            });
            const result = await res.json();
            appendSystem(`Action executed: ${action.type} — ${result.success ? 'OK' : result.error}`);
            currentActionIndex++;
            showNextConfirmation();
        }

        function rejectAction() {
            const action = pendingActions[currentActionIndex];
            appendSystem(`Action rejected: ${action.type}`);
            currentActionIndex++;
            showNextConfirmation();
        }

        async function sendWithActions() {
            const text = inputEl.value.trim();
            if (!text || sendBtn.disabled) return;
            inputEl.value = '';
            inputEl.style.height = 'auto';
            sendBtn.disabled = true;
            appendMessage('user', text);
            const assistantDiv = appendMessage('assistant', '');
            try {
                const res = await fetch('/chat_actions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: text })
                });
                const data = await res.json();
                if (data.error) {
                    assistantDiv.textContent = `Error: ${data.error}`;
                    return;
                }
                assistantDiv.textContent = data.response;
                if (data.pending_confirmation && data.pending_confirmation.length > 0) {
                    pendingActions = data.pending_confirmation;
                    currentActionIndex = 0;
                    showNextConfirmation();
                }
            } catch(e) {
                assistantDiv.textContent = `Error: ${e.message}`;
            } finally {
                sendBtn.disabled = false;
                inputEl.focus();
            }
        }

        async function restoreSession() {
            const res = await fetch('/history');
            const data = await res.json();
            if (data.history && data.history.length > 0) {
                data.history.forEach(msg => {
                    if (msg.role === 'user' || msg.role === 'assistant') {
                        appendMessage(msg.role, msg.content);
                    }
                });
                appendSystem(`Session restored — ${data.history.length} messages`);
            }
            if (data.project) {
                projectStatus.textContent = `${data.project} · restored`;
                projectStatus.className = 'active';
                const opts = projectSelect.options;
                for (let i = 0; i < opts.length; i++) {
                    if (opts[i].value === data.project) {
                        projectSelect.selectedIndex = i;
                        break;
                    }
                }
            }
        }

        async function loadProjectsAndRestore() {
            await loadProjects();
            await restoreSession();
        }

        loadProjectsAndRestore();
    </script>
</body>
</html>
